apiVersion: apps/v1
kind: Deployment
metadata:
  name: "httpd-isis"
  namespace: web
spec:
  replicas: 2
  selector:
    matchLabels:
      run: "httpd-isis"
  template:
    metadata:
      annotations:
        xinutec.org/config: |
          ==> default.conf <==
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              # Directory 301 (/x -> /x/) stays relative, so it never leaks
              # the internal listen port into the Location header.
              absolute_redirect off;

              location ~ \.(md|py|sh)$ {
                  default_type text/plain;
              }

              # Slice images for the DICOM viewer: thousands of small files,
              # each one a request, and every request on this host re-runs
              # basic auth. Without a Cache-Control header browsers fall back
              # to heuristic freshness and revalidate constantly, paying that
              # cost again. The images are derived from archived studies and
              # only change when they are deliberately re-exported.
              # Deliberately NOT `immutable`: a re-export should still reach a
              # reader who reloads, rather than being pinned for a whole day.
              location ~* ^/share/[^/]+/slices/.+\.webp$ {
                  add_header Cache-Control "public, max-age=86400";
              }
          }
      labels:
        run: "httpd-isis"
    spec:
      containers:
      - image: "nginxinc/nginx-unprivileged:alpine"
        name: "httpd-isis"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /usr/share/nginx/html/share
          name: webroot
        - mountPath: /etc/nginx/conf.d/default.conf
          name: "nginx-config"
          readOnly: true
          subPath: default.conf
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: webroot
        persistentVolumeClaim:
          claimName: "httpd-isis-storage"
      - configMap:
          name: "httpd-isis-nginx-config"
        name: "nginx-config"
