# dev-lint: allow-no-netpol — pre-existing: namespace needs a default-deny NetworkPolicy + allow-graph (network-hardening)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-db
  namespace: life
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: life-db
  template:
    metadata:
      labels:
        app: life-db
    spec:
      # The official image runs as uid 999 (mysql) when started unprivileged.
      # fsGroup 999 is a no-op for the existing PVC: the data dir was created
      # by the image's entrypoint as uid 999 already.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          # 12.3 is the current LTS (GA 2026-05-28, supported to Jun 2029). MariaDB has
          # no downgrade path, so dump before bumping this:
          #   scripts/mariadb-major-upgrade.sh before life life   (then after)
          image: mariadb:12.3
          # No readOnlyRootFilesystem: mariadb writes /run/mysqld and its data dir.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3306
          env:
            # Migrate the system tables on first start after a major bump.
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MARIADB_DATABASE
              value: life
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: life-secret
                  key: DB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: life-secret
                  key: DB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: life-secret
                  key: DB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mariadb-data
          # startupProbe holds liveness off until the server accepts connections, so a
          # major-version MARIADB_AUTO_UPGRADE (start->upgrade->shutdown->restart) can't be
          # SIGKILLed mid-run the way this DB and health-db were on 2026-07-22/23. home-db
          # got this fix at the time; life-db did not.
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 30
            periodSeconds: 10
            # was implicit 1s; a busy server can miss that and get killed for being slow
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: life-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: life-db
  namespace: life
spec:
  clusterIP: None
  selector:
    app: life-db
  ports:
    - port: 3306
