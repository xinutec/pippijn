apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-auth
  namespace: health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-auth
  template:
    metadata:
      labels:
        app: health-auth
    spec:
      # Matches the nonroot "node" user in the image (uid 1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # dev-lint: allow-rootfs-rw — pre-existing writable rootfs (fix per-app: add emptyDir for writable paths)
        - name: auth
          image: xinutec/health-sync:latest
          command: ["node", "dist/server.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          env:
            - name: AUTH_PORT
              value: "3000"
            - name: DB_HOST
              value: health-db
            - name: DB_NAME
              value: health
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: DB_PASSWORD
            - name: FITBIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: FITBIT_CLIENT_ID
            - name: FITBIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: FITBIT_CLIENT_SECRET
            - name: NC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: NC_CLIENT_ID
            - name: NC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: NC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: SESSION_SECRET
            # Comma-separated PhoneTrack session tokens allowed through
            # the Owntracks proxy. Requests with any other token are
            # rejected before reaching Nextcloud — protects both NC's
            # brute-force counter and the proxy's in-process state.
            - name: OWNTRACKS_ALLOWED_TOKENS
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: OWNTRACKS_ALLOWED_TOKENS
            # Shared secret gating the /internal service API — the coach app
            # reads the user's places to auto-select a training location.
            # Provisioned into health-secret out-of-band; optional so the pod
            # still starts if absent (then /internal rejects every request).
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: SERVICE_TOKEN
                  optional: true
            # Factor scorer pipeline gate. DISABLED in prod (2026-05-23
            # late) after discovering golden harness was silently testing
            # the legacy cascade while production ran the factor scorer
            # — see feedback_parity_tools_must_mirror_env.md. The factor
            # scorer produced material regressions vs cascade on every
            # blessed day (train trips disappearing, train-vs-driving
            # misclassification, etc.) but those went unnoticed because
            # prod-db.sh didn't propagate the flag. Re-enable when the
            # factor scorer is properly calibrated under the now-correct
            # parity harness AND its golden output matches ground truth
            # at least as well as the cascade. Set to "1" to enable.
            # - name: USE_FACTOR_SCORER
            #   value: "1"
            # - name: USE_BIOMETRIC_FACTOR
            #   value: "1"
            # Presence-continuity emission factor — same flag the
            # decode cron uses. velocity.ts in the auth pod does not
            # read this directly, but it must be present on the auth
            # pod env so scripts/prod-db.sh can mirror it via printenv
            # for the golden harness. See feedback_parity_tools_must_mirror_env.
            - name: USE_CONTINUITY_CONTINUATION
              value: "1"
            # C4 continuity flags (task #224) — same flags the decode
            # cron uses, and for the same reason as the line above: the
            # auth pod does not read them, but scripts/prod-db.sh
            # mirrors the pod env via printenv so a Mac replay decodes
            # the same day the cron wrote. These gate the HSMM decode
            # itself, so a missing mirror is the exact
            # feedback_parity_tools_must_mirror_env failure. Rationale
            # and the open defect (#366) are documented at the cron —
            # kubes/health/k8s/08-decode-recent.yaml.
            - name: USE_CADENCE_IMPUTATION
              value: "1"
            - name: USE_SEGMENT_EVIDENCE
              value: "1"
            - name: USE_CHAIN_CONTEXT
              value: "1"
            - name: USE_REACQUIRE_ROBUST_SPEED
              value: "1"
            # Building-escape walk corrector (case-based: route a drawn walk
            # around building blocks it falsely crosses; leave genuine visits —
            # doorsteps, hospitals, concourses — alone). Display-geometry only;
            # measured on the 2026-07-01 fixture before enabling. ON by default
            # in code since 2026-07-02 (an opt-in flag made local replays
            # diverge from prod); "0" is the emergency off-switch, so the
            # explicit "1" here is documentation, not activation.
            - name: WALK_BUILDING_ESCAPE
              value: "1"
            # Serve the verified Lean geometry passes on the request path
            # (docs/proposals/2026-07-verified-core-lean.md). `on` routes five
            # proved display passes — simplify, removeSpurs, trim, despike,
            # rejectSpikes — through the in-process bridge to verified_cli
            # (LEAN_CLI is set by the Dockerfile), serving the theorem-backed
            # output. Golden is 31/31 byte-identical to the pure-TS pipeline
            # under `on` (the golden corpus measures 2 accepted Douglas-Peucker
            # near-ties, which wash out downstream; the accepted manifest also
            # carries entries observed in production on days the corpus does not
            # cover), and any bridge failure falls
            # back to TS (swallow-over-wrong). "off"/unset reverts instantly.
            - name: LEAN_PASSES
              value: "on"
            # Verified Lean walk-matcher (qMatchWalkSegment). ON since
            # 2026-07-21. Correctness has been gated all along (compare-match
            # 185/185 bit-exact against the BigInt twin); what blocked the flip
            # was cost — an earlier attempt the same day made the decode-recent
            # job exceed its 1800s deadline, because the matcher adds a
            # synchronous bridge call per leg and its corridor-graph Viterbi
            # dwarfs the geometry passes. Fixed at the source: the hot path ran
            # on Lean `Int`, which is a GMP bignum past 2^31, and now runs on
            # `Nat` (scalar to 2^63) with spatial indices for the footprints and
            # candidate segments. Measured over the same legs: ~0.36 s/leg,
            # ~70x cheaper than at the failed flip and ~3x the TS float matcher.
            # `off`/unset reverts instantly; any bridge failure falls back to TS.
            - name: LEAN_MATCH
              value: "on"
            # Verified Lean rail shortest path (Verified.Rail.dijkstraC, proved
            # correct AND complete). SHADOW, not on: the search runs and is
            # compared, but the TS path is what gets drawn. The gate is 6/6
            # EXACT and the tenant was exercised identical end-to-end, but that
            # is one fixture day — thin next to the matcher's 185 legs, and a
            # rail divergence redraws a whole route rather than shifting it by
            # millimetres, so it earns a soak before `on`.
            #
            # On the server this fires only on the miss-driven route-cache fill
            # for a first-seen route (rail-route-fill.ts, #363) — the railSnap
            # pass itself is an indexed cache lookup. Bulk volume is in
            # 07-rail-refresh.yaml, which prints the ledger.
            - name: LEAN_RAIL
              value: "shadow"
            # Verified Lean GPS Kalman filter (Verified.Geo.Kalman.filterGpsTrack).
            # SHADOW: it runs on every velocity compute and is compared, but the
            # TS track is what feeds segmentation.
            #
            # The corpus evidence for `on` is already strong — golden 32/32
            # byte-identical, truth 295 held, walk ratchet 0/0/0/0, decoder
            # scoreboard OK, and ~7 ms median per compute (~1% of a run). What
            # earns the soak anyway is position, not doubt: this is the most
            # UPSTREAM pass in the pipeline, so a divergence moves every
            # downstream boundary rather than shifting one leg.
            #
            # It is also the first tenant with a genuinely non-zero divergence
            # class. Lean's `Float.cos` and V8's `Math.cos` disagree by 1 ULP on
            # ~7.6% of real latitudes, `metersToDegreesLon` calls `cos`, and the
            # covariance recursion carries that into `lon` on ~0.5% of rows
            # (femtometres — far under the 1e-7° display grid). Two libms cannot
            # be reconciled, so the per-day `lean-kalman[...]` ledger grades
            # EXACT / ULP / DIVERGED and reserves DIVERGED for the thing no ULP
            # story explains: the two arms keeping DIFFERENT fixes.
            #
            # Shadow costs the SAME compute as `on` (both arms run either way),
            # so the soak is free; all it buys back is that a length divergence
            # on a day the corpus does not cover gets logged instead of served.
            # Flip to "on" after ~a week of EXACT/ULP with zero length diffs.
            - name: LEAN_KALMAN
              value: "shadow"
            # Verified Lean GPS quality pre-filter
            # (Verified.Geo.GpsQuality.qualityFilterGps) — the incoherent-run
            # dropper that runs one call ABOVE the Kalman filter.
            #
            # Unlike every tenant above it, this one has an EXACT gate rather
            # than a bounded-ULP one, and the reason is structural: the filter
            # is drop-only. Every fix it emits is a copy of an input fix, never
            # a computed value. Inputs cross the bridge as IEEE bit patterns, so
            # both arms select from bit-identical candidates and `cos` reaches
            # only the threshold comparisons. `npm run compare-gpsquality` is
            # 32/32 days agreeing exactly on the keep-set.
            #
            # So the ledger has TWO levels, not three: there is no expected
            # divergence class to grade, and anything other than EXACT is a
            # DECISION flip — the two arms disagreeing about whether a run is
            # garbage. If one appears, adjudicate which arm is right; do not
            # widen the verdict to quiet it.
            #
            # Shadow anyway, for the same reason as LEAN_KALMAN: position, not
            # doubt. This is now the most upstream pass of all, so a divergence
            # moves every downstream boundary. Both arms run either way, so the
            # soak is free.
            - name: LEAN_GPSQUALITY
              value: "shadow"
            # Verified Lean biometric label rewrites
            # (Verified.Geo.BiometricLabels) — the four velocity passes that let
            # the step counter overrule what GPS decided about a segment's mode:
            # cadenceCorrect, revertIsolatedCadence, jitterWalkToStay,
            # walkThrough. Four passes behind one flag because they are one
            # port of one TS module, and splitting them would mean four soaks
            # of a surface that shares every threshold. Five CALL SITES, since
            # revertIsolatedCadence runs twice — before and after the rail
            # annotators — and both are served.
            #
            # EXACT gate, like LEAN_GPSQUALITY and for a related reason: every
            # output is a discrete label, an index, or a `toFixed` rendering —
            # never a fresh real. The reason strings go through
            # Verified.JsNum.toFixed, which implements the ECMA-262 rounding
            # rule against the double's exact binary value, so even the
            # formatted numbers are compared exactly rather than to a
            # tolerance.
            #
            # The one place a libm difference could reach a decision is the
            # stay-extent veto in correctStationaryWalkThrough — a haversine
            # max against an 80 m threshold — and only for a segment whose
            # extent sits within 1 ULP of exactly 80 m.
            #
            # Corpus evidence before shipping: `npm run golden` under
            # LEAN_BIOLABELS=on is 32/32 byte-identical with the ledger reading
            # 128/0f EXACT — 32 days x 4 passes, every call served by the
            # verified core, zero failures, zero divergences.
            #
            # Shadow first anyway. These passes run BEFORE the merge, so a flip
            # here moves every downstream boundary; and both arms run either
            # way, so the soak costs nothing but the logging.
            - name: LEAN_BIOLABELS
              value: "shadow"
          resources:
            requests:
              # Idle most of the time; a /api/velocity compute is a short CPU
              # burst. Keep the reservation modest but non-trivial.
              cpu: 250m
              memory: 128Mi
            limits:
              # The velocity pipeline is CPU-bound (map-matchers / HMM decode):
              # ~6 CPU-seconds for a busy day. A 200m cap CFS-throttled that to
              # ~50 s wall-clock (measured: walkMatch 4 s of CPU → 40 s on-pod).
              # 2 cores lets a compute finish in a few seconds; isis sits ~7%.
              cpu: "2"
              # Headroom for the local-OSM-mirror cold-start: multiple
              # large Overpass responses (5-50 MB each) can be in flight
              # while filling osm_points / osm_lines for a new bbox.
              # Steady-state usage stays well under this.
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: health-auth
  namespace: health
spec:
  selector:
    app: health-auth
  ports:
    - port: 80
      targetPort: 3000
