apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-decode-recent
  namespace: health
spec:
  # Daily at 06:00 UTC — after focus-refresh (Sunday 04:00) and
  # rail-refresh (daily 05:00) so the HSMM decode sees fresh
  # focus_places + rail geometry inputs.
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Headroom for the per-minute rail/road proximity (#238): one
      # nearbyWays lookup per distinct ~11 m minute-median location, and
      # the first run after a code/area change pays cold-cache Overpass
      # fetches at the 300 m radius. Steady state is well under this;
      # the margin absorbs that cold first run.
      #
      # 1800 (was 900) since the Lean shadow: when the image carries the
      # verified decoder (LEAN_CLI, set by the Dockerfile), decode-day
      # A/Bs each decoded day against it — ~30 s/day on top of the decode
      # (quantise + export + both decodes), ~3.5 min for the 7-day window.
      # Purely observational; grep pod logs for `lean-shadow`.
      activeDeadlineSeconds: 1800
      template:
        spec:
          # Matches the nonroot "node" user in the image (uid 1000).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            # dev-lint: allow-rootfs-rw — pre-existing writable rootfs (fix per-app: add emptyDir for writable paths)
            - name: decode
              image: xinutec/health-sync:latest
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # Decode the recent window, then rebuild presence_log from the
              # fresh decoded_days. presence_log feeds the empty-day inference
              # and the presence-continuity emission factor;
              # without this second step it goes stale and both silently
              # degrade. DB-only and idempotent (DELETE+INSERT over the window).
              command:
                - sh
                - -c
                - >-
                  node dist/cli/decode-day.js --user pippijn --tz Europe/London --days 7 &&
                  node dist/cli/refresh-presence-log.js 90
              env:
                - name: DB_HOST
                  value: health-db
                - name: DB_NAME
                  value: health
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: health-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: health-secret
                      key: DB_PASSWORD
                - name: NC_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: health-secret
                      key: NC_CLIENT_ID
                - name: NC_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: health-secret
                      key: NC_CLIENT_SECRET
                # C4 cross-segment continuity (task #224,
                # docs/proposals/2026-07-continuity-c4.md). Enabled
                # 2026-07-17 after the decoder scoreboard
                # (npm run score-decoder, 10 audited days vs ground
                # truth) improved on five days with one adjudicated
                # loss: legs-mode 65->70, legs-line 8->10, phantom
                # rides 5->4, and 06-12 + 06-16 each gaining journeys.
                #
                # USE_CADENCE_IMPUTATION: steps_intraday only writes
                # non-zero minutes, so a truly-still minute arrives as
                # null and the zero-inflated cadence emission SKIPS —
                # walking pays no step penalty exactly where steps
                # would refute it. Impute 0 only when the watch is
                # demonstrably alive around the minute.
                # USE_SEGMENT_EVIDENCE: segment-level displacement
                # physics, softened by bracket slop.
                # USE_CHAIN_CONTEXT: exit->entry place reachability +
                # line boarding feasibility at the transition.
                # USE_REACQUIRE_ROBUST_SPEED: widen the stationary
                # speed emission right after a GPS reacquisition,
                # scaled by rail proximity — post-occlusion Kalman
                # speed is dominated by position-jump artefacts.
                #
                # KNOWN OPEN DEFECT (task #366): the per-minute mode
                # prior scales with duration, so a slow vehicle leg can
                # still read as a stay (2026-05-25 12:40-12:49 is the
                # recorded case). Flipping these flags does not cause
                # it — it exposes it.
                - name: USE_CADENCE_IMPUTATION
                  value: "1"
                - name: USE_SEGMENT_EVIDENCE
                  value: "1"
                - name: USE_CHAIN_CONTEXT
                  value: "1"
                - name: USE_REACQUIRE_ROBUST_SPEED
                  value: "1"
                # Verified Lean HSMM decoder — ON: the cron now SERVES the
                # verified quantised decode (decodeServed in src/lean/lean-hsmm.ts
                # → decodeHsmmViaLean), not the TS float trellis. Flipped
                # 2026-07-23 after: (a) a 76-day float↔quant history sweep found
                # ZERO minute-flips (the quantised decode matched the float decode
                # on every day, back to 2026-05-08), and (b) a live on-path
                # validation decoded 3 days on/off and got byte-identical served
                # segments with no fallback. Safe by construction: any bridge
                # failure (missing binary, spawn/parse error, degenerate path)
                # falls back to the TS decode with a warn — a verified-core hiccup
                # never corrupts or crashes the served decode. The per-day
                # `lean-hsmm[on] <date> …` ledger stays (lean↔tsQuant + float↔quant)
                # and fleetwatch's check_health_lean_core reds any DIVERGED, so the
                # flip is watched daily. Reversible: set back to "shadow" to serve
                # TS again. CRON-side only — the interactive /api/velocity path
                # still serves TS (waits on the ~5× Lean speed gap). off disables
                # the A/B entirely.
                #
                # DEMOTED on->shadow 2026-08-01. `on` here was a WRITE, not just
                # a serve: decode-day is the ONLY caller of saveDecode, so under
                # `on` it was the Lean decode that landed in decoded_days. The
                # standing decision is that production writes come from the TS
                # implementation while Lean runs alongside as measurement, so
                # this stays shadow until a flip is made deliberately and with
                # the ledger evidence in hand.
                #
                # Nothing is lost from the soak: `shadow` still decodes BOTH ways
                # and prints the same per-day `lean-hsmm[shadow] <date> ...`
                # ledger. Only the authorship of the persisted row changes.
                - name: LEAN_HSMM
                  value: "shadow"
                # Verified Lean station-chain resolver (#711). Added 2026-08-10:
                # this flag did not exist until then, so the tenant was observed
                # NOWHERE on live data -- the same hole LEAN_RAIL had before
                # 2026-08-01. The port has been complete and compared 11/11 on
                # the decoded-day corpus since #672; what it lacked was any
                # measurement on days nobody chose to capture.
                #
                # `shadow` and not `on` for the reason that keeps HSMM and
                # PASSES at shadow: this resolver runs inside
                # segmentsFromStates, so its board/alight stations are PERSISTED
                # to decoded_days by this very job. Production writes come from
                # the TS implementation while Lean runs alongside as
                # measurement.
                #
                # Costs this job ~2.87 MiB/day of extra request (measured over
                # the 11 fixtures; 3.31 max), 81% of it the route graph, which
                # cannot be pruned without moving results -- see
                # src/lean/lean-station-chain.ts. That is under a tenth of what
                # LEAN_HSMM above already ships (#411).
                #
                # Reads as `lean-stationchain[shadow] <date> EXACT n pair(s) /
                # m leg(s)` per day, and a day with no named-line train leg
                # makes no bridge call at all rather than paying 2.87 MiB to
                # decide nothing.
                - name: LEAN_STATIONCHAIN
                  value: "shadow"
                # Serve the verified Lean geometry passes when re-decoding days
                # (docs/proposals/2026-07-verified-core-lean.md) — kept identical
                # to the health-auth server so a cached (cron-persisted) day and a
                # fresh server compute draw the same geometry. `on` also logs the
                # per-day `lean-passes[on] <date> …` ledger (calls/failures/
                # divergences) so the flip stays continuously observable. The
                # line adjudicates each divergence against the accepted near-tie
                # manifest and splits the tally by run, so what to look for is
                # `EXACT` or `all accepted`; `UNEXPLAINED` means a divergence
                # nobody has signed off, and `IN SERVED OUTPUT` means it came
                # from the persisted decode rather than the observational
                # shadow run. TS fallback on any bridge failure.
                #
                # DEMOTED on->shadow 2026-08-01, with LEAN_HSMM and for the same
                # reason: the geometry these passes produce feeds the segments
                # this job PERSISTS, so serving Lean here put Lean output in the
                # database. Kept in step with 03-auth.yaml, as the note above
                # requires -- both are shadow now.
                - name: LEAN_PASSES
                  value: "shadow"
                # Verified Lean rail shortest-path. Added 2026-08-01: this flag
                # was absent here, so the tenant was observed NOWHERE -- the
                # golden corpus structurally cannot reach it (it preloads
                # rail_route_cache, #233) and no cron set it. `shadow` costs one
                # Dijkstra per uncached route and is the only place the tenant
                # gets exercised on real data at all.
                #
                # PROMOTED shadow->on 2026-08-06 (#432) — see LEAN_KALMAN below
                # for why these four and not the other three.
                - name: LEAN_RAIL
                  value: "on"
                # Verified Lean walk-matcher — ROLLED BACK to shadow 2026-07-31
                # after serving `on` since 2026-07-21. This job is where the
                # regression was caught: its `lean-match[on]` ledger reported
                # UNEXPLAINED divergences IN SERVED OUTPUT on four of the last
                # seven days, and adjudicating one (#398) found the served line
                # was the worse of the two. Full reasoning in 03-auth.yaml; keep
                # the two in step, or a cron-persisted day and a fresh server
                # compute disagree about the same leg.
                #
                # Cost is not the blocker and was not the reason: ~0.36 s/leg
                # since the hot path moved off Lean `Int` onto `Nat`.
                - name: LEAN_MATCH
                  value: "shadow"
                # Verified Lean GPS Kalman filter — SHADOW, matching
                # 03-auth.yaml so a cron-persisted day and a fresh server
                # compute see the same track. This is where the ledger actually
                # gets read: decode-day prints `lean-kalman[shadow] <date> …`
                # per day, and that line is the soak. See 03-auth.yaml for why
                # the most upstream pass earns a soak despite three green gates,
                # and what EXACT / ULP / DIVERGED mean.
                #
                # PROMOTED shadow->on 2026-08-06 (#432), together with
                # LEAN_GPSQUALITY, LEAN_BIOLABELS and LEAN_RAIL below.
                #
                # THIS JOB PERSISTS, so `on` here puts Lean output in the
                # database — the exact objection that demoted LEAN_HSMM and
                # LEAN_PASSES on 2026-08-01, and both of those stay `shadow`.
                # What separates these four is the gate they carry: gpsquality
                # and biolabels are EXACT (drop-only / discrete labels — no
                # fresh reals), rail is EXACT over its own cron's volume, and
                # kalman's only divergence class is a bounded libm ULP whose
                # effect is femtometres, far under the 1e-7 deg display grid.
                # A wrong flip is still persisted rather than recomputed, which
                # is why the four with the strongest gates went and the two
                # whose output IS the drawn geometry did not.
                - name: LEAN_KALMAN
                  value: "on"
                # Verified Lean GPS quality pre-filter — SHADOW, matching
                # 03-auth.yaml. Same reason as LEAN_KALMAN: this job is where
                # the ledger is actually read, as `lean-gpsquality[shadow]
                # <date> …` per day.
                #
                # Read this line differently from the Kalman one. The gate is
                # EXACT, not bounded-ULP — the filter is drop-only, so both arms
                # select from bit-identical candidates. There is no expected
                # divergence class, and `n DIVERGED` means the two arms
                # disagreed about whether a run of fixes is garbage. That is a
                # finding to adjudicate, not noise to absorb. See 03-auth.yaml.
                #
                # PROMOTED shadow->on 2026-08-06 (#432) — see LEAN_KALMAN above.
                - name: LEAN_GPSQUALITY
                  value: "on"
                # Verified Lean biometric label rewrites — the four
                # step-counter-overrules-GPS passes. EXACT gate; see 03-auth.yaml
                # for why, and for the corpus evidence.
                #
                # This job is where the ledger is actually READ: decode-day
                # prints `lean-biolabels[shadow] <date> <calls>/<fails>f
                # <verdict>` per day, so the soak is legible here in a way it is
                # not from the request path. Expect one line per day with five
                # calls on it — one per call site, revertIsolatedCadence twice —
                # and EXACT. Anything else is a
                # decision flip: adjudicate which arm is right rather than
                # widening the verdict.
                #
                # PROMOTED shadow->on 2026-08-06 (#432) — see LEAN_KALMAN above.
                # The ledger tag becomes `lean-biolabels[on]`; the five-calls-and
                # -EXACT expectation above is unchanged.
                - name: LEAN_BIOLABELS
                  value: "on"
                # Raise the warm bridge-call ceiling (default 5s) for the batch
                # path: this job has no user waiting, and the heaviest real legs
                # take several seconds on the throttled pod, so the tight ceiling
                # dropped ~4/80 of the biggest legs to the TS fallback. 30s keeps
                # them on the verified path; the interactive /api/velocity server
                # keeps the 5s default so a slow leg never stalls a request.
                - name: LEAN_CALL_TIMEOUT_MS
                  value: "30000"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  # 1536Mi (was 768Mi): the Lean shadow holds the exported
                  # integer tensors (~60 MB JSON with the C4 flags on) in
                  # node while the spawned verified_cli peaks ~300 MB.
                  memory: 1536Mi
