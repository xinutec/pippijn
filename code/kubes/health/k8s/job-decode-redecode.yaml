# One-shot re-decode of the recent window under the CURRENT flag set.
#
# Distinct from job-decode-backfill.yaml, which is the 90-day
# CLASSIFIER_VERSION backfill and deliberately carries NO LEAN_* flags. This
# one mirrors 08-decode-recent.yaml's env exactly — including the Lean tenants
# — because its whole purpose is to re-run the nightly decode after a tenant
# flag changed, so the persisted rows are the ones the current configuration
# produces rather than the ones the old configuration left behind.
#
# NOT part of the standing apply set: apply by hand, bump the name's date
# suffix each time (a completed Job's spec is immutable).
#
#   kubectl apply -f job-decode-redecode.yaml
#   kubectl -n health logs -f job/health-decode-redecode-20260731
#
# History: 20260731 — after LEAN_MATCH was rolled back on→shadow (#398), to
# re-decode 2026-07-24..07-30, the seven days whose nightly runs had served
# the verified matcher. `--days 7` counts back from the job's own start date,
# so this is only that window when applied on 2026-07-31.
apiVersion: batch/v1
kind: Job
metadata:
  name: health-decode-redecode-20260731
  namespace: health
spec:
  # Same budget as the nightly cron — identical work, identical window.
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        # dev-lint: allow-rootfs-rw — pre-existing writable rootfs (fix per-app: add emptyDir for writable paths)
        - name: decode
          image: xinutec/health-sync:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - >-
              node dist/cli/decode-day.js --user pippijn --tz Europe/London --days 7 &&
              node dist/cli/refresh-presence-log.js 90
          env:
            - name: DB_HOST
              value: health-db
            - name: DB_NAME
              value: health
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: DB_PASSWORD
            - name: NC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: NC_CLIENT_ID
            - name: NC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: health-secret
                  key: NC_CLIENT_SECRET
            - name: USE_CADENCE_IMPUTATION
              value: "1"
            - name: USE_SEGMENT_EVIDENCE
              value: "1"
            - name: USE_CHAIN_CONTEXT
              value: "1"
            - name: USE_REACQUIRE_ROBUST_SPEED
              value: "1"
            # THIS JOB HAD GONE STALE IN BOTH DIRECTIONS, found 2026-08-11 while
            # promoting the matcher. It claims in its header to mirror
            # 08-decode-recent.yaml's env exactly, and it did not:
            #
            #   LEAN_HSMM / LEAN_PASSES  `on` here, `shadow` in the cron since
            #                            the 2026-08-01 rollback. Running this
            #                            Job would have persisted LEAN-AUTHORED
            #                            decodes — the precise thing that
            #                            rollback existed to stop.
            #   LEAN_KALMAN / GPSQUALITY / BIOLABELS
            #                            `shadow` here, `on` in the cron since
            #                            2026-08-06 (#432).
            #   LEAN_RAIL                absent entirely, `on` in the cron.
            #
            # So the one Job whose purpose is to make persisted rows match the
            # standing configuration would have written rows matching a
            # configuration a fortnight out of date — and it is also the REPAIR
            # path if a tenant is rolled back, which means the repair would have
            # made things worse than the fault.
            #
            # A mirror that drifts silently is worse than no mirror, because it
            # is reached for precisely when something has already gone wrong.
            # Aligned to the cron below; check it against 08-decode-recent.yaml
            # before every run, since nothing enforces this.
            - name: LEAN_HSMM
              value: "shadow"
            - name: LEAN_PASSES
              value: "shadow"
            - name: LEAN_RAIL
              value: "on"
            # #711 — `on` as in 08-decode-recent.yaml, which this Job exists to
            # mirror. Promoted 2026-08-11 with the cron.
            - name: LEAN_STATIONCHAIN
              value: "on"
            # Re-promoted with the cron 2026-08-11 (#9 wired the flip gate and
            # it is green). Kept in step with 08-decode-recent.yaml and
            # 03-auth.yaml — a redecode under a DIFFERENT flag set than the
            # nightly would persist rows the standing configuration would not
            # produce, which is the one thing this Job must never do.
            #
            # If either tenant is rolled back, this Job is the repair: set the
            # flags here to match, bump the name's date suffix, and re-run it
            # over the affected window.
            - name: LEAN_MATCH
              value: "on"
            # `on` since #432 promoted these three in the cron on 2026-08-06;
            # they had been left at shadow here. See the drift note above.
            - name: LEAN_KALMAN
              value: "on"
            - name: LEAN_GPSQUALITY
              value: "on"
            - name: LEAN_BIOLABELS
              value: "on"
            - name: LEAN_CALL_TIMEOUT_MS
              value: "30000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
