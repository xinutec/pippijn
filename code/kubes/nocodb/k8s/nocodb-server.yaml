---
# dev-lint: allow-no-netpol — pre-existing: namespace needs a default-deny NetworkPolicy + allow-graph (network-hardening)
apiVersion: apps/v1
# dev-lint: allow-no-netpol
kind: Deployment
metadata:
  namespace: nocodb
  name: nocodb-server
  labels:
    app: nocodb
spec:
  selector:
    matchLabels:
      pod-label: nocodb-server-pod
  replicas: 1
  # Recreate, NOT the default RollingUpdate. nocodb keeps its metadata in SQLite
  # (`server-data/noco.db`) on the ReadWriteOnce `nocodb-storage` PVC, and a
  # rolling update surges a second pod BEFORE terminating the first. k3s backs
  # that PVC with local-path (a hostPath), which does not enforce RWO the way a
  # real CSI attach does — so both pods would mount it and two nocodb processes
  # would write the same SQLite file. Recreate means old-terminates-then-new, a
  # brief outage instead of a corruption risk. Same rule as the databases.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        pod-label: nocodb-server-pod
    spec:
      volumes:
      # Create the shared files volume to be used in both pods
      - name: server-storage
        persistentVolumeClaim:
          claimName: nocodb-storage
      # dev-lint: allow-unhardened — the nocodb image ships no non-root user and
      # runs as root writing to a root-owned /usr/app/data (verified on the live
      # pod); forcing runAsNonRoot breaks its data directory.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nocodb
        image: nocodb/nocodb:0.257.2
        imagePullPolicy: Always
        volumeMounts:
        - name: server-storage
          mountPath: /usr/app/data
          subPath: server-data
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  namespace: nocodb
  name: nocodb-server
  labels:
    app: nocodb
spec:
  selector:
    pod-label: nocodb-server-pod
  ports:
  - protocol: TCP
    port: 8080
