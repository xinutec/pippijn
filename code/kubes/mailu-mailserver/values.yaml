domain: xinutec.org
hostnames:
  - mail.xinutec.org
# Override the Mailu core image tag for ALL components (defaults to Chart.AppVersion,
# which chart 2.7.3 pins to 2024.06.55). Bumped to .56 for the Roundcube 1.6.17 security
# fix (CVE-2026-54432/54433, webmail), then to .57 and .61 to close the fleet-check
# version lag rather than for any specific CVE (.58-.61: Roundcube 1.6.18, three boolean
# settings that could not be turned off, none of which we set, and a webmail SSO
# cookie fix). Mailu requires all
# components on one version, so this bumps them together rather than webmail-only. Rolling
# `front` (which binds the mail ports via hostPort) deadlocks — delete the OLD front pod
# after sync.sh to hand the ports over (a few seconds' front downtime); see sync.sh.
mailuVersion: "2024.06.61"
# Roundcube DB password: chart 2.7.x guards it on upgrade (bitnami-common) and demands
# the existing value. We point at the in-cluster `mailu-roundcube` secret.
# ⚠ FOOTGUN: if `mailu-roundcube` was created BY the chart, then the moment you set
# existingSecret the chart stops templating it and `helm upgrade` PRUNES it — deleting
# the password. It must exist as a STANDALONE (non-helm-managed) secret. Recovery if
# lost:
#   helm get manifest mailu --revision <last-good> -n mailu-mailserver \
#     | awk 'BEGIN{RS="\n---\n"} /kind: Secret/&&/name: mailu-roundcube/{print}' \
#     | kubectl apply -f -
# (secretKey + initialAccount.password are still supplied inline via secrets.yaml.)
global:
  database:
    roundcube:
      existingSecret: mailu-roundcube
      existingSecretPasswordKey: roundcube-db-password
initialAccount:
  enabled: true
  username: "mailadmin"
  domain: "xinutec.org"
  #password: ""  # XXX: add here when updating
  mode: "update"
logLevel: INFO
persistence:
  size: 100Gi
  storageClass: local-path
ingress:
  ingressClassName: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
# Redis: use our own external redis (k8s/redis-ext.yaml — official redis:8-alpine)
# instead of the chart's bundled Bitnami subchart. That subchart is pinned to the
# FROZEN bitnamilegacy/redis (no security updates after the Aug-2025 Bitnami
# paywall); redis:8-alpine is free + maintained. Mailu hardcodes no redis auth
# (cluster-internal only). The DB IDs are the chart defaults and match the bundled
# usage: rspamd db0 (bayes), admin quota db1, admin rate-limit db2. The rspamd bayes
# was migrated (BGSAVE→RDB) into mailu-redis-ext before this cutover.
redis:
  enabled: false
externalRedis:
  enabled: true
  host: mailu-redis-ext
  port: 6379
  adminQuotaDbId: 1
  adminRateLimitDbId: 2
  rspamdDbId: 0
# ClamAV: the tag is overridden to a current clamav-debian release. The chart's
# probes always pass; xinutec-infra's helm plan asks clamd itself (ClamdAnswers)
# instead of patching them (2026-10-03).
clamav:
  image:
    tag: "1.5.4"
# Tika (attachment text extraction for dovecot full-text search). The chart pins it
# by tag+digest; override the tag to bump it. Tag-only (not digest) on purpose: the
# hub "digest" field is the arm64 child, and pinning that would break amd64 amun;
# apache/tika release tags are immutable so tag-only is safe. Keep the "-full" variant
# (all parsers). Stateless service — a restart just briefly pauses attachment indexing.
# 4.1.0 (2026-10-04): checked first against 3.3.1 with dovecot's own request
# (PUT /tika/, Accept: text/plain) on a .docx and a .pdf — identical text, both 200.
tika:
  image:
    tag: "4.1.0-1-full"
#secretKey: ""  # XXX: add here when updating

# The chart's own policies: default-deny for every mailu pod, everything allowed
# between them, the mail ports open to anyone on front, 80/443 on front from the
# ingress controller, and no egress at all for tika and oletools (task #1763).
# mailu-redis-ext is not the chart's; its policy is in k8s/redis-ext.yaml.
networkPolicy:
  enabled: true
