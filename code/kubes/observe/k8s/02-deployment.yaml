# observe's fleet tier: a static nginx serving the runs ledger — published
# reconstruction meshes (glTF) + the before/after viewer page — to the phone
# and any browser on the VPN. The Mac cannot be reached from the phone (one-way
# VPN peer), so this mirror is how scans become visible away from the Mac.
#
# Content lives on a hostPath (/srv/observe) that the Mac pushes with
# rsync --delete (observe repo, scripts/publish_run.sh). DELIBERATELY NOT
# BACKED UP: the Mac's data/runs/ ledger is the source of truth and this
# directory is a disposable mirror, rebuilt in full by the next publish.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observe-viewer
  namespace: observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observe-viewer
  template:
    metadata:
      labels:
        app: observe-viewer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx-unprivileged's nginx uid
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            # THE network gate, same as recall/scanner: a bare hostPort would
            # DNAT on every address isis has, including the public one, and a
            # k8s hostPort rule bypasses the NixOS firewall entirely. Pinned
            # to the WireGuard address, the DNAT rule can only match a packet
            # that arrived on wg0. Room scans of the home are private; the
            # public IP must never answer on 8091. No Ingress, no DNS record.
            - containerPort: 8091
              hostPort: 8091 # dev-lint: allow-host-port — bound to wg0 only, see hostIP
              hostIP: 10.100.0.2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8091
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: content
              mountPath: /srv/observe
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp # nginx-unprivileged keeps pid + temp files here
      volumes:
        - name: content
          hostPath:
            path: /srv/observe
            type: Directory
        - name: nginx-conf
          configMap:
            name: observe-viewer-nginx
        - name: tmp
          emptyDir: {}
