# nginx vhost for the observe runs viewer: static files only. Two disjoint
# trees so the Mac can mirror each with rsync --delete (observe repo,
# scripts/publish_run.sh): /srv/observe/web (viewer assets, served at /) and
# /srv/observe/runs (the runs ledger, served at /runs/).
apiVersion: v1
kind: ConfigMap
metadata:
  name: observe-viewer-nginx
  namespace: observe
data:
  default.conf: |
    server {
      listen 8091;
      root /srv/observe/web;
      autoindex off;

      # Meshes are ~20-55 MB of glTF JSON; gzip makes the WireGuard transfer
      # to the phone bearable. .gltf has no entry in nginx's mime.types, so it
      # serves as application/octet-stream — hence that type in the list.
      gzip on;
      gzip_min_length 1024;
      gzip_types application/json model/gltf+json application/octet-stream
                 text/css application/javascript;

      location = /healthz {
        return 200 "ok\n";
      }

      location /runs/ {
        alias /srv/observe/runs/;
      }

      location / {
        # Viewer assets are tiny and change with every iteration — always
        # revalidate (the WebView's heuristic caching showed stale pages).
        # Meshes under /runs/ keep heuristic caching: run dirs are immutable.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
      }
    }
