# Default-deny egress: the viewer serves static files and makes no outbound
# calls at all (not even DNS), so a compromised pod can exfiltrate nothing.
# Egress-only for the same reason as recall/scanner: kubelet probes are
# node-sourced *ingress*, which default-deny-ingress drops under k3s'
# kube-router and takes the pod NotReady. Ingress is gated at the network
# layer instead (wg0-pinned hostPort, no public ingress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: observe
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress: []
