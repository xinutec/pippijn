---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: nextcloud
  name: nextcloud-ingress
  annotations:
    # NO cert-manager.io/cluster-issuer and no tls block (#1294): security.acme
    # on isis issues dash.xinutec.org by DNS-01 and host nginx serves it. A
    # Kubernetes certificate here would be unused and would renew by HTTP-01,
    # whose challenge path reaches host nginx and is answered with Nextcloud
    # rather than the token — so it could only fail.
    #
    # ⚠ This tree is NOT in the Dhall model, so nothing re-renders it and
    # `generate.sh --check` has never compared it. ⚠ Deleting the Certificate is
    # not enough on its own — ingress-shim recreates dash-tls within seconds from
    # the annotation. See frontdoor-unowned.dhall.
    #
    # The body-size and read-timeout below are live behaviour, not certificate
    # machinery — host nginx renders them as client_max_body_size and
    # proxy_read_timeout, and dropping them would break large uploads.
    nginx.ingress.kubernetes.io/proxy-body-size: "4096m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: dash.xinutec.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextcloud-server
            port:
              number: 80
