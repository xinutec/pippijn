---
apiVersion: v1
kind: Service
metadata:
  name: certbot-forward
  namespace: ircd
spec:
  type: ExternalName
  externalName: xinutec-validation.barfooze.de
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: ircd
  name: irc-ingress
  # NO cert-manager annotation and no tls block since 2026-09-01 (#1294):
  # security.acme on isis issues irc.xinutec.net by DNS-01 and host nginx serves
  # it. This object exists ONLY to delegate /barfooze to someone else.
  #
  # What was here mattered, and is worth keeping in mind rather than just
  # deleting: the annotation was the SOLE definition of the irc-tls Certificate
  # (cert-manager created it owned by this Ingress). It read "letsencrypt-staging"
  # while the live object had been changed to prod by hand, so applying this file
  # would have reissued IRC's certificate from an untrusted CA and broken TLS for
  # every connected client. Found 2026-07-27 by the drift sweep, the first run
  # that ever compared ircd. That whole hazard leaves with the annotation.
spec:
  ingressClassName: nginx
  rules:
  - host: irc.xinutec.net
    http:
      paths:
      - path: /barfooze #/.well-known
        pathType: Prefix
        backend:
          service:
            name: certbot-forward
            port:
              number:  80
