---
apiVersion: v1
kind: Service
metadata:
  name: certbot-forward
  namespace: ircd
spec:
  type: ExternalName
  externalName: xinutec-validation.barfooze.de
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: ircd
  name: irc-ingress
  # NO cert-manager annotation and no tls block (#1294): security.acme on isis
  # issues irc.xinutec.net by DNS-01 and host nginx serves it. This object exists
  # ONLY to delegate /barfooze to someone else.
  #
  # ⚠ DO NOT PUT ONE BACK. An issuer annotation here is the SOLE definition of
  # the irc-tls Certificate — cert-manager creates it owned by this Ingress — so
  # a stale value in this file reissues IRC's certificate on the next apply and
  # breaks TLS for every connected client.
spec:
  ingressClassName: nginx
  rules:
  - host: irc.xinutec.net
    http:
      paths:
      - path: /barfooze #/.well-known
        pathType: Prefix
        backend:
          service:
            name: certbot-forward
            port:
              number:  80
