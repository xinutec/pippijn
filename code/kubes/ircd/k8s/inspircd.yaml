---
# dev-lint: allow-no-netpol — pre-existing: namespace needs a default-deny NetworkPolicy + allow-graph (network-hardening)
# Backed up since 2026-07-28 (odin backup-prepare.sh, "isis: rsync ircd-storage").
# The waiver that used to sit here claimed permchannels.conf was "cheaply
# regenerated" — it is not regenerable at all. InspIRCd rewrites it as permanent
# channels/topics/modes change, and it is gitignored on purpose, so it lived
# nowhere but this PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: ircd
  name: ircd-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
# dev-lint: allow-no-netpol
kind: Deployment
metadata:
  namespace: ircd
  name: inspircd
spec:
  # Stated rather than defaulted so the model and this file agree. ⚠ Safe: it
  # lives in `spec`, NOT `spec.template`, so it forces no rollout — unset and 1
  # are the same running pod. The same change vps-pippijn made 2026-08-27.
  replicas: 1
  selector:
    matchLabels:
      run: inspircd
  # hostPort binds the node interface, so two pods can't coexist during a rollout —
  # recreate (brief blip) instead of a RollingUpdate that would deadlock on the port.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        run: inspircd
    spec:
      # The image already runs as the unprivileged `irc` user (uid 39, see the
      # Dockerfile's `USER irc`); the IRC ports are all >1024 so no root is
      # needed. Declare it so a rollout can't silently regress to root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 39
        runAsGroup: 39
        fsGroup: 39
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ircd-storage
        # The certificate cert-manager renews, mounted so the process can reach
        # it. Before this, `conf/secret` was a subPath of the PVC above filled in
        # by a hand-run `kubectl cp`, so a renewed secret changed nothing — and
        # ⚠ restarting the pod did not help, because it reloaded the same PVC
        # files.
        - name: tls
          secret:
            secretName: irc-tls
            # inspircd runs as uid 39 and the projection is root-owned. A server
            # certificate and its key, in a pod running only that server.
            defaultMode: 0444
      containers:
        - name: ircd
          image: xinutec/ircd:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            # hostPort so inspircd sees the real client IP (spam/ban tracking,
            # WHOIS) rather than the load-balancer's — a Service would NAT it.
            - containerPort: 6697
              hostPort: 6697  # dev-lint: allow-host-port
            - containerPort: 7005
              hostPort: 7005  # dev-lint: allow-host-port
            - containerPort: 7776
              hostPort: 7776  # dev-lint: allow-host-port
          readinessProbe:
            tcpSocket:
              port: 6697
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /etc/inspircd/conf/secret
              name: data
              subPath: secret
            - mountPath: /etc/inspircd/data
              name: data
              subPath: data
            # ⚠ NO subPath, and that is the whole point rather than an omission.
            # A subPath mount is copied once at start and NEVER updated by the
            # kubelet, so mounting the certificate that way would reproduce the
            # exact bug being fixed — a renewed secret that never reaches the
            # process — while looking like it had been solved. Mounted as a
            # directory, the projection is refreshed in place on renewal, and
            # init.sh's poll notices the change and rehashes.
            - mountPath: /etc/inspircd/conf/tls
              name: tls
              readOnly: true
