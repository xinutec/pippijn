# tmux for the dev container.
#
# Written for two readers: Pippijn attaching from a terminal, and a program
# driving the session over ssh. Where the two want different things, the
# person wins -- the program has a better source for the same information.

# Scrollback IS the read buffer: `capture-pane -S -3000` reads history, where
# screen's hardcopy could only ever return the visible window. Anything that
# scrolled past between two polls is otherwise gone.
set -g history-limit 50000

# Window numbers and names are how both readers address a window: 0/1/2 by
# habit at the keyboard, by name from a script. A rename nobody asked for
# breaks the second one silently, so shells do not get to do it.
set -g base-index 0
set -g allow-rename off
setw -g automatic-rename off

# The size a window gets when no client is attached. Measured, after reading a
# pane at 80 columns and finding every line wrapped: unattached windows sit at
# the 80x24 default, so a program reading them gets the content folded. This
# applies ONLY while nobody is attached -- attaching still resizes to the real
# terminal -- which is why it is preferred over `window-size manual`.
set -g default-size 200x50

set -g default-terminal "tmux-256color"
set -g mouse on
setw -g mode-keys vi

# Deliberately NOT set: `window-size manual`. It would keep panes at their
# created width no matter who attaches, which is what a screen-scraper wants --
# screen reflows every pane to the smallest attached client, so a narrow
# terminal silently truncates what a capture returns. It is left off because
# the fix belongs elsewhere: conversation content is read from the session's
# transcript, which has no width at all, and the pane is only consulted for the
# things the transcript does not hold (composer contents, a pending permission
# prompt, whether a turn is still running). Those stay legible at any width.
# If pane scraping ever does become the primary read path, turn it on here.
